# chamedoon-site: static Astro build behind Nginx Proxy Manager (container port 8080).
# Releases live in /srv/site/<id>; /srv/site/current is a symlink swapped atomically on deploy.
server {
  listen 8080;
  server_name _;
  root /srv/site/current;
  absolute_redirect off;
  port_in_redirect off;
  server_tokens off;
  charset utf-8;
  charset_types text/plain text/css text/xml application/xml application/javascript application/rss+xml text/markdown text/csv text/vtt application/json;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript application/json application/rss+xml image/svg+xml text/markdown text/csv text/vtt;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hashed build assets: cache forever.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }
  # Large media (videos, post audio/covers, OG images) from the media volume; range requests are on by default.
  location /media/site/v/ {
    alias /srv/media/;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
    types { video/mp4 mp4; audio/mpeg mp3; text/vtt vtt; image/avif avif; image/jpeg jpg jpeg; image/png png; image/webp webp; application/json json; }
  }
  location /media/site/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
    types { font/woff2 woff2; image/avif avif; image/jpeg jpg; image/png png; image/svg+xml svg; text/vtt vtt; text/plain txt; }
  }
  # Markdown twins: for agents, not for the index (canonical is the HTML page).
  location ~ \.md$ {
    types { } default_type "text/markdown; charset=utf-8";
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location ~ \.csv$ { return 410; }
  location ~ "^/(robots\.txt|llms\.txt|llms-full\.txt|[0-9a-f]{32}\.txt)$" {
    types { } default_type "text/plain; charset=utf-8";
    add_header Cache-Control "public, max-age=3600" always;
  }
  location ~ ^/(sitemap-[a-z-]+\.xml|rss\.xml)$ {
    add_header Cache-Control "public, max-age=3600" always;
  }
  location / {
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=600" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
  error_page 404 /404.html;
  location = /404.html { internal; add_header Cache-Control "no-store" always; }
}
