# /opt/chamedoon-site/docker-compose.yml on bigde-vps
services:
  chamedoon-site:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: chamedoon-site
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./releases:/srv/site:ro
      - ./media:/srv/media:ro
    networks:
      - nginxproxymanager_default
networks:
  nginxproxymanager_default:
    external: true
