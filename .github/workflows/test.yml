name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gallery-js:
    name: Mini App gallery (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner image ships Node and Google Chrome; the check uses no npm packages.
      - name: Run gallery check
        run: node --experimental-websocket backend/tests/js/gallery_check.mjs

  backend:
    name: Golden paths and backend suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chamedoon
          POSTGRES_PASSWORD: chamedoon
          POSTGRES_DB: chamedoon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chamedoon -d chamedoon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://chamedoon:chamedoon@localhost:5432/chamedoon
      SECRET_KEY: test-secret-key-that-is-long-enough-for-hs256-ok
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run all backend tests
        run: >
          pytest
          --cov=matching
          --cov=miniapp
          --cov=notifications
          --cov=users
          --cov=api
          --cov=item_requests
          --cov=outreach
          --cov=home
          --cov=courier
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-fail-under=85
