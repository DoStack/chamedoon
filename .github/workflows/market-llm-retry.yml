name: Market LLM retry

# Optional. Daily extract is the Vercel cron only.
# This job does not crawl channels. It only retries posts whose LLM review failed,
# for up to 6 hours, then regex rules create the request.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry failed LLM reviews
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: ${{ secrets.KOOLBAR_CRON_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Skipping LLM retry. Daily Vercel extract still runs. GitHub CRON_SECRET is optional."
            exit 0
          fi
          url="${CRON_URL:-https://koolbar-jet.vercel.app/api/cron/market-llm-retry/}"
          curl -fsS -X GET -H "Authorization: Bearer ${CRON_SECRET}" "$url"
