name: Market extract

on:
  schedule:
    - cron: "0 0,12,18 * * *"
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ingest and convert market posts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: ${{ secrets.KOOLBAR_CRON_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Add GitHub secret CRON_SECRET (same value as Vercel CRON_SECRET)."
            exit 1
          fi
          url="${CRON_URL:-https://koolbar-jet.vercel.app/api/cron/market-migrate/}"
          curl -fsS -X GET -H "Authorization: Bearer ${CRON_SECRET}" "$url"
