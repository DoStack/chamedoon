{% if rows %}
  <ul class="support-related">
    {% for row in rows %}
      <li>
        <a href="{{ row.url }}">{{ row.label }}</a>
        <span class="support-chip is-{{ row.tone }}">{{ row.status_label }}</span>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="support-empty">{{ empty }}</p>
{% endif %}
