                    type: string
                    enum:
                    - maintenance
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
      x-error-codes:
      - auth_invalid
      - auth_required
      - listing_gone
      - maintenance
      - method_not_allowed
      - miniapp_off
      - server_error
      - session_expired
      - user_blocked
