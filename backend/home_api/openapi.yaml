  /api/v1/me/listings/{id}/contact/:
    post:
      operationId: listing_contact
      description: '«تماس» and «دیدن پست اصلی» both call this. Safe to retry: a listing
        already opened in the window never counts again, so no idempotency key. Also
        call it again when the app regains focus after `not_member`. A Telegram error
        at the gate fails open and answers `membership_checked: false`.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - me
      security:
      - telegramJwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
        '401':
          description: '`auth_invalid`: initData or the token failed its check.; `auth_required`:
            This call needs a token. Exchange initData first.; `session_expired`:
            The token is expired: exchange again. From the exchange itself: initData
            is over 24 hours old, reopen the app.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - auth_invalid
                    - auth_required
                    - session_expired
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '403':
          description: '`gate_banned`: Banned from the channel, so joining cannot
            work.; `miniapp_off`: The new Mini App is off for this person: stay on
            the old pages.; `not_member`: Not a member of the channel. The error carries
            `channel` and `join_url`.; `user_blocked`: This account is deactivated.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - gate_banned
                    - miniapp_off
                    - not_member
                    - user_blocked
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
                  join_url:
                    type: string
                    description: For `not_member`.
                  channel:
                    $ref: '#/components/schemas/GateChannel'
        '404':
          description: '`listing_gone`: The listing was removed, hidden or merged
            away.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - listing_gone
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '405':
          description: '`method_not_allowed`: This method is not supported here.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - method_not_allowed
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '409':
          description: '`listing_closed`: The listing was closed since it was cached.;
            `no_channel`: This listing has no city or country channel to ask for,
            so its contact stays closed.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - listing_closed
                    - no_channel
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '429':
          description: '`rate_limited`: Too many calls. Retry after the `Retry-After`
            header.; `reveal_cap`: The cap of new listings in a rolling 24 hours is
            reached. A listing opened in that window still opens.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - rate_limited
                    - reveal_cap
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '500':
          description: '`server_error`: Something failed on our side. Safe to retry.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - server_error
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '503':
          description: '`maintenance`: Maintenance is on. See /public/meta/.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - maintenance
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
      x-error-codes:
      - auth_invalid
      - auth_required
      - gate_banned
      - listing_closed
      - listing_gone
      - maintenance
      - method_not_allowed
      - miniapp_off
      - no_channel
      - not_member
      - rate_limited
      - reveal_cap
      - server_error
      - session_expired
      - user_blocked
