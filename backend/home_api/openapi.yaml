                    - listing_gone
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '405':
          description: '`method_not_allowed`: This method is not supported here.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - method_not_allowed
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '500':
          description: '`server_error`: Something failed on our side. Safe to retry.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
