        required: true
      - in: query
        name: country
        schema:
          type: string
          minLength: 1
        required: true
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          pattern: ^\d{1,6}$
        description: 'Opaque: send back next_cursor as it came.'
      - in: query
        name: furnished
        schema:
          type: boolean
          default: false
      - in: query
        name: gender
        schema:
          enum:
          - female
          - male
          - couple
          type: string
          minLength: 1
        description: |-
          * `female` - female
          * `male` - male
          * `couple` - couple
      - in: query
        name: kind
        schema:
          enum:
          - offer
          - wanted
          type: string
          minLength: 1
        description: |-
          * `offer` - Offer
          * `wanted` - Wanted
      - in: query
        name: max
        schema:
          type: integer
          minimum: 0
        description: Monthly value.
      - in: query
        name: min
        schema:
          type: integer
          minimum: 0
        description: Monthly value.
      - in: query
        name: move
        schema:
          type: string
          format: date
      - in: query
        name: nowbs
        schema:
          type: boolean
          default: false
      - in: query
        name: owner
        schema:
          type: boolean
          default: false
      - in: query
        name: q
        schema:
          type: string
          maxLength: 80
      - in: query
        name: reg
        schema:
          type: boolean
          default: false
      - in: query
        name: sort
        schema:
          enum:
          - new
          - value
          - cheap
          - dear
          - date
          type: string
          minLength: 1
        description: |-
          * `new` - new
          * `value` - value
          * `cheap` - cheap
          * `dear` - dear
          * `date` - date
      - in: query
        name: term
        schema:
          enum:
          - lease
          - sublet
          - short
          - lease_transfer
          type: string
          minLength: 1
        description: |-
