        schema:
          type: array
          items:
            type: string
            minLength: 1
        description: property_type values, plus bed1, bed2, bed3.
      - in: query
        name: unpriced
        schema:
          type: boolean
          default: false
      - in: query
        name: warm
        schema:
          type: boolean
          default: false
      tags:
