      - capped
      - unknown_area
      - no_city
      - not_understood
      - other_city
      type: string
      description: |-
        * `parsed` - parsed
        * `simple` - simple
        * `capped` - capped
        * `unknown_area` - unknown_area
        * `no_city` - no_city
        * `not_understood` - not_understood
        * `other_city` - other_city
    TermEnum:
      enum:
      - lease
      - sublet
      - short
      - lease_transfer
      type: string
      description: |-
        * `lease` - lease
        * `sublet` - sublet
        * `short` - short
        * `lease_transfer` - lease_transfer
    ThemeEnum:
      enum:
      - auto
      - light
      - dark
      type: string
      description: |-
        * `auto` - Follow Telegram
        * `light` - Light
        * `dark` - Dark
    TriEnum:
      enum:
      - 'yes'
      - 'no'
      - unknown
      type: string
      description: |-
        * `yes` - Yes
        * `no` - No
        * `unknown` - Not stated
    UploadedPhoto:
      type: object
      properties:
        photo_id:
          type: string
          format: uuid
        url:
          type: string
        thumb:
          type: string
      required:
      - photo_id
      - thumb
      - url
    ViewerListing:
      type: object
      properties:
        is_owner:
          type: boolean
        review_state:
          allOf:
          - $ref: '#/components/schemas/ReviewStateEnum'
          description: |-
            Only an owner can get in_review or hidden; anyone else gets listing_gone.

            * `live` - live
            * `in_review` - in_review
            * `hidden` - hidden
        listing:
          $ref: '#/components/schemas/PublicListing'
      required:
      - is_owner
      - listing
      - review_state
    Waitlist:
      type: object
      properties:
        created:
          type: boolean
          description: 'False: already on the waitlist (F01#7).'
        city_name:
          type: string
      required:
      - city_name
      - created
    WaitlistRequestRequest:
      type: object
      properties:
        country:
          type: string
          maxLength: 2
        city_name:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - city_name
  securitySchemes:
    telegramJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
