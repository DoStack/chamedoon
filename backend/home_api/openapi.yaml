components:
  schemas:
    Account:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/ExchangeUser'
          description: '`telegram_username` null: F21#8.'
        prefs:
          $ref: '#/components/schemas/Prefs'
        counts:
          $ref: '#/components/schemas/AccountCounts'
        channel:
          allOf:
          - $ref: '#/components/schemas/GateChannel'
          nullable: true
          description: 'F21#5: the chosen city''s channel. Null: no city or no channel.'
        bot_open:
          type: boolean
        bot_blocked:
          type: boolean
        bot_url:
          type: string
      required:
      - bot_blocked
      - bot_open
      - bot_url
      - channel
      - counts
      - prefs
      - user
    AccountCounts:
      type: object
      properties:
        saved:
          type: integer
        listings:
          type: integer
        alerts_active:
          type: integer
        alerts_new:
          type: integer
          description: 'The saved tab''s red badge: new alert listings only.'
        unread:
          type: integer
          description: 'The bell''s count: every notification.'
      required:
      - alerts_active
      - alerts_new
      - listings
      - saved
      - unread
    ActionEnum:
      enum:
      - close
      - restore
      - renew
      type: string
      description: |-
        * `close` - close
        * `restore` - restore
        * `renew` - renew
    AlertCreateRequestRequest:
      type: object
      properties:
        country:
          type: string
          minLength: 1
          maxLength: 2
        city:
          type: string
          minLength: 1
          description: Metro name or slug.
          maxLength: 64
        filters:
          $ref: '#/components/schemas/AlertFiltersRequest'
        delivery:
          allOf:
          - $ref: '#/components/schemas/DeliveryEnum'
          default: now
      required:
      - city
      - country
    AlertFilters:
      type: object
      description: The feed's filters as an alert keeps them. A map box is never saved
        (F15#9).
      properties:
        types:
          type: array
          items:
            type: string
        min:
          type: integer
          minimum: 0
          nullable: true
        max:
          type: integer
          minimum: 0
          nullable: true
        unpriced:
          type: boolean
        areas:
          type: array
          items:
            type: string
        area_ids:
          type: array
          items:
            type: integer
          maxItems: 6
        term:
          oneOf:
          - $ref: '#/components/schemas/TermEnum'
          - $ref: '#/components/schemas/BlankEnum'
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        move:
          type: string
          format: date
          nullable: true
        by:
          type: string
          format: date
          nullable: true
        furnished:
          type: boolean
        owner:
          type: boolean
        bills:
          type: boolean
        warm:
          type: boolean
        reg:
          type: boolean
        nowbs:
          type: boolean
    AlertFiltersRequest:
      type: object
      description: The feed's filters as an alert keeps them. A map box is never saved
        (F15#9).
      properties:
        types:
          type: array
          items:
            type: string
            minLength: 1
        min:
          type: integer
          minimum: 0
          nullable: true
        max:
          type: integer
          minimum: 0
          nullable: true
        unpriced:
          type: boolean
        areas:
          type: array
          items:
            type: string
            minLength: 1
        area_ids:
          type: array
          items:
            type: integer
          maxItems: 6
        term:
          oneOf:
          - $ref: '#/components/schemas/TermEnum'
          - $ref: '#/components/schemas/BlankEnum'
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        move:
          type: string
          format: date
          nullable: true
        by:
          type: string
          format: date
          nullable: true
        furnished:
          type: boolean
        owner:
          type: boolean
        bills:
          type: boolean
        warm:
          type: boolean
        reg:
          type: boolean
        nowbs:
          type: boolean
    AlertList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AlertRow'
        active_count:
          type: integer
          description: Counts against `cap`; alerts from a wanted post do not.
        cap:
          type: integer
        bot_open:
          type: boolean
          description: 'False: the person never opened the bot (F15#3).'
        bot_blocked:
          type: boolean
          description: 'True: the last send got a 403 (F16#13, F23#4).'
        bot_url:
          type: string
        notify_enabled:
          type: boolean
          description: 'False: F23#3, offer to turn notifications on.'
      required:
      - active_count
      - bot_blocked
      - bot_open
      - bot_url
      - cap
      - notify_enabled
      - results
    AlertListings:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicCard'
        total:
          type: integer
        next_cursor:
          type: string
          nullable: true
      required:
      - next_cursor
      - results
      - total
    AlertRow:
      type: object
      properties:
        id:
          type: integer
        country:
          type: string
        city:
          type: string
        city_slug:
          type: string
        city_active:
          type: boolean
          description: 'False: F16#11, the city left. Offer only delete.'
        filters:
          $ref: '#/components/schemas/AlertFilters'
        delivery:
          $ref: '#/components/schemas/DeliveryEnum'
        alert_state:
          allOf:
          - $ref: '#/components/schemas/AlertStateEnum'
          description: |-
            paused and off offer no delivery choice (F16).

            * `active` - active
            * `paused` - paused
            * `off` - off
        paused_until:
          type: string
          format: date-time
          nullable: true
        origin:
          allOf:
          - $ref: '#/components/schemas/OriginEnum'
          description: |-
            wanted: F16#11, not editable and outside the cap.

            * `app` - app
            * `bot` - bot
            * `wanted` - wanted
        wanted_listing_id:
          type: integer
          nullable: true
        new_count:
          type: integer
          description: '«[N] جدید»: matched since it was last viewed. 0 unless active.'
        created_at:
          type: string
          format: date-time
      required:
      - alert_state
      - city
      - city_active
      - city_slug
      - country
      - created_at
      - delivery
      - filters
      - id
      - new_count
      - origin
      - paused_until
      - wanted_listing_id
    AlertSave:
      type: object
      properties:
        save_outcome:
          allOf:
          - $ref: '#/components/schemas/SaveOutcomeEnum'
          description: |-
            created: F15#2. duplicate: F15#5, it already exists and is on. reactivated: F15#8, the same one was off or paused.

            * `created` - created
            * `duplicate` - duplicate
            * `reactivated` - reactivated
        alert:
          $ref: '#/components/schemas/AlertRow'
        bot_open:
          type: boolean
          description: 'False: follow with F15#3. Saved either way.'
        bot_url:
          type: string
      required:
      - alert
      - bot_open
      - bot_url
      - save_outcome
    AlertStateEnum:
      enum:
      - active
      - paused
      - 'off'
      type: string
      description: |-
        * `active` - active
        * `paused` - paused
        * `off` - off
    AnswerEnum:
      enum:
      - taken
      - available
      type: string
      description: |-
        * `taken` - taken
        * `available` - available
    Area:
      type: object
      properties:
        id:
          type: integer
        canonical:
          type: string
        name_fa:
          type: string
        group:
          type: string
          description: Heading in the all-areas sheet. Only Toronto has them.
        lat:
          type: number
          format: double
          nullable: true
          description: One rough point for the whole area, never a listing's place.
        lng:
          type: number
          format: double
          nullable: true
        listing_count:
          type: integer
        week_count:
          type: integer
          description: Seen in the last 7 days. The order of `areas`.
      required:
      - canonical
      - group
      - id
      - lat
      - listing_count
      - lng
      - name_fa
      - week_count
    AreaHit:
      type: object
      properties:
        id:
          type: integer
        name_fa:
          type: string
        matched:
          type: string
          description: The name that matched, for the second line (F07#3).
        country:
          type: string
        city:
          type: string
        city_slug:
          type: string
      required:
      - city
      - city_slug
      - country
      - id
      - matched
      - name_fa
    AreaSearch:
      type: object
      properties:
        here:
          type: array
          items:
            $ref: '#/components/schemas/AreaHit'
        elsewhere:
          type: array
          items:
            $ref: '#/components/schemas/AreaHit'
          description: 'F07#4: these offer «تغییر شهر».'
      required:
      - elsewhere
      - here
    Availability:
      type: object
      properties:
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          description: |-
            noted: counted, listing unchanged. rented: this answer closed it. confirmed: marked available. closed: it was closed already.

            * `noted` - noted
            * `rented` - rented
            * `confirmed` - confirmed
            * `closed` - closed
      required:
      - outcome
    AvailabilityRequestRequest:
      type: object
      properties:
        answer:
          $ref: '#/components/schemas/AnswerEnum'
      required:
      - answer
    BlankEnum:
      enum:
      - ''
    Cities:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/CountryRow'
      required:
      - countries
    CityAreas:
      type: object
      properties:
        country:
          type: string
        city:
          type: string
        areas:
          type: array
          items:
            $ref: '#/components/schemas/Area'
        no_area_count:
          type: integer
          description: Offers linked to no area, which show only under «همه‌جا».
      required:
      - areas
      - city
      - country
      - no_area_count
    CityGuess:
      type: object
      properties:
        country:
          type: string
        city:
          type: string
        known:
          type: boolean
          description: 'False: no channel for it.'
      required:
      - city
      - country
      - known
    CityRow:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        name_fa:
          type: string
        listing_count:
          type: integer
        channel:
          $ref: '#/components/schemas/GateChannel'
      required:
      - channel
      - listing_count
      - name
      - name_fa
      - slug
    ClosedReasonEnum:
      enum:
      - owner
      - users
      - expired
      type: string
      description: |-
        * `owner` - owner
        * `users` - users
        * `expired` - expired
    Contact:
      type: object
      properties:
        telegram:
          type: string
          description: 'Handle without @. Blank: none.'
        telegram_url:
          type: string
        phone:
          type: string
        source_url:
          type: string
          description: 'The original post. Blank: none, so no «دیدن پست اصلی».'
        has_any:
          type: boolean
          description: 'False: nothing to show (F11#17).'
        membership_checked:
          type: boolean
          description: 'False: do not print «عضو کانال» (F11#19).'
        gate:
          allOf:
          - $ref: '#/components/schemas/GateEnum'
          description: |-
            How this contact opened. owner: the person's own listing, nothing was counted.

            * `member` - member
            * `failed_open` - failed_open
            * `gate_off` - gate_off
            * `owner` - owner
        reveals_left:
          type: integer
          description: New listings this person can still open in the rolling 24 hours.
      required:
      - gate
      - has_any
      - membership_checked
      - phone
      - reveals_left
      - source_url
      - telegram
      - telegram_url
    CountryRow:
      type: object
      properties:
        code:
          type: string
        channel:
          allOf:
          - $ref: '#/components/schemas/GateChannel'
          nullable: true
        cities:
          type: array
          items:
            $ref: '#/components/schemas/CityRow'
      required:
      - channel
      - cities
      - code
    DeepLink:
      type: object
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/DeepLinkKindEnum'
          description: |-
            landing: a normal open. legacy: go to legacy_path, a template page.

            * `landing` - landing
            * `country` - country
            * `city` - city
            * `listing` - listing
            * `legacy` - legacy
        malformed:
          type: boolean
          description: The link could not be read, so this is a normal open.
        country:
          type: string
        city:
          type: string
          description: The metro's name. From the listing when the link has one.
        city_slug:
          type: string
        city_known:
          type: boolean
          description: 'False: no channel for this city, so choose one.'
        listing_id:
          type: integer
          nullable: true
          description: 'Can differ from the link: a merged listing resolves to the
            one it became.'
        listing_state:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SavedStateEnum'
          - $ref: '#/components/schemas/NullEnum'
        filters:
          $ref: '#/components/schemas/DeepLinkFilters'
        src:
          type: string
          description: Pass to the exchange as `src`, so the first one is stored once.
        legacy_path:
          type: string
      required:
