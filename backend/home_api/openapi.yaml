openapi: 3.0.3
info:
  title: Chamedoon housing API
  version: '1'
  description: The contract of the new Mini App. Every error is JSON with a stable
    `code`; the client switches on `code`, never on `detail`. A non-JSON response
    (a platform error) counts as `server_error`. `x-error-codes` lists every code
    of an operation. `x-served` says when an operation is not live yet.
paths:
  /api/v1/auth/exchange/:
    post:
      operationId: auth_exchange
      description: 'Trade initData for a token. Safe to retry. While old pages remain
        it also signs the session cookie, so links to them keep working. Flag off
        for this person: `miniapp_off`, with no token and no session; only a link''s
        `src` is stored. The old pages sign in through /app/login/.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
          description: ''
        '400':
          description: '`auth_outside`: No initData: the app was opened outside Telegram.;
            `bad_request`: The body or a parameter could not be read.; `validation_failed`:
            A field is wrong. `fields` maps each field to its codes.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - auth_outside
                    - bad_request
                    - validation_failed
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
                  fields:
                    type: object
                    description: Field name to its codes, for `validation_failed`.
                    additionalProperties:
                      type: array
                      items:
                        type: string
        '401':
          description: '`auth_invalid`: initData or the token failed its check.; `session_expired`:
            The token is expired: exchange again. From the exchange itself: initData
            is over 24 hours old, reopen the app.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - auth_invalid
                    - session_expired
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '403':
          description: '`miniapp_off`: The new Mini App is off for this person: stay
            on the old pages.; `user_blocked`: This account is deactivated.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - miniapp_off
                    - user_blocked
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '405':
          description: '`method_not_allowed`: This method is not supported here.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - method_not_allowed
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '429':
          description: '`rate_limited`: Too many calls. Retry after the `Retry-After`
            header.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - rate_limited
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '500':
          description: '`server_error`: Something failed on our side. Safe to retry.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - server_error
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '503':
          description: '`auth_unavailable`: The server cannot check initData right
            now.; `maintenance`: Maintenance is on. See /public/meta/.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - auth_unavailable
                    - maintenance
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
      x-error-codes:
      - auth_invalid
      - auth_outside
      - auth_unavailable
      - bad_request
      - maintenance
      - method_not_allowed
      - miniapp_off
      - rate_limited
      - server_error
      - session_expired
      - user_blocked
      - validation_failed
