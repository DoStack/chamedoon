    get:
      operationId: feed_fallback
      description: Only when the manifest or a snapshot fails. Same card shape and
        the same filter and sort rules as the client runs over a snapshot. Cached
        for a minute, so do not send Authorization.
      parameters:
      - in: query
        name: areas
        schema:
          type: array
          items:
            type: string
            minLength: 1
      - in: query
        name: bills
        schema:
          type: boolean
          default: false
      - in: query
        name: by
        schema:
          type: string
          format: date
      - in: query
        name: city
        schema:
          type: string
          minLength: 1
