        description: |-
          * `female` - female
          * `male` - male
          * `couple` - couple
      - in: query
        name: kind
        schema:
          enum:
          - offer
          - wanted
          type: string
          minLength: 1
        description: |-
          * `offer` - Offer
          * `wanted` - Wanted
      - in: query
        name: max
        schema:
          type: integer
          minimum: 0
        description: Monthly value.
      - in: query
        name: min
        schema:
          type: integer
          minimum: 0
        description: Monthly value.
      - in: query
        name: move
        schema:
          type: string
          format: date
      - in: query
        name: nowbs
        schema:
          type: boolean
          default: false
      - in: query
        name: owner
        schema:
          type: boolean
          default: false
      - in: query
        name: q
        schema:
          type: string
          maxLength: 80
      - in: query
        name: reg
        schema:
          type: boolean
          default: false
      - in: query
        name: sort
        schema:
          enum:
          - new
          - value
          - cheap
          - dear
          - date
          type: string
          minLength: 1
        description: |-
          * `new` - new
          * `value` - value
          * `cheap` - cheap
          * `dear` - dear
          * `date` - date
      - in: query
        name: term
        schema:
          enum:
          - lease
          - sublet
          - short
          - lease_transfer
          type: string
          minLength: 1
        description: |-
          * `lease` - lease
          * `sublet` - sublet
          * `short` - short
          * `lease_transfer` - lease_transfer
      - in: query
        name: types
        schema:
          type: array
          items:
            type: string
            minLength: 1
        description: property_type values, plus bed1, bed2, bed3.
      - in: query
        name: unpriced
        schema:
          type: boolean
          default: false
      - in: query
        name: warm
        schema:
          type: boolean
          default: false
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feed'
          description: ''
        '400':
          description: '`validation_failed`: A field is wrong. `fields` maps each
            field to its codes.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - validation_failed
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
                  fields:
                    type: object
                    description: Field name to its codes, for `validation_failed`.
                    additionalProperties:
                      type: array
                      items:
                        type: string
        '405':
          description: '`method_not_allowed`: This method is not supported here.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - method_not_allowed
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '429':
          description: '`rate_limited`: Too many calls. Retry after the `Retry-After`
            header.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - rate_limited
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '500':
          description: '`server_error`: Something failed on our side. Safe to retry.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - server_error
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '503':
          description: '`feed_failed`: The fallback feed could not be built.; `maintenance`:
            Maintenance is on. See /public/meta/.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - feed_failed
                    - maintenance
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
      x-error-codes:
      - feed_failed
      - maintenance
      - method_not_allowed
      - rate_limited
      - server_error
      - validation_failed
  /api/v1/public/listings/{id}/:
