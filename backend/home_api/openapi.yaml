components:
  schemas:
    AnswerEnum:
      enum:
      - taken
      - available
      type: string
      description: |-
        * `taken` - taken
        * `available` - available
    Availability:
      type: object
      properties:
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          description: |-
            noted: counted, listing unchanged. rented: this answer closed it. confirmed: marked available. closed: it was closed already.

            * `noted` - noted
            * `rented` - rented
            * `confirmed` - confirmed
            * `closed` - closed
      required:
      - outcome
    AvailabilityRequestRequest:
      type: object
      properties:
        answer:
          $ref: '#/components/schemas/AnswerEnum'
      required:
      - answer
    Cities:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/CountryRow'
      required:
      - countries
    CityRow:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        name_fa:
          type: string
        listing_count:
          type: integer
        channel:
          $ref: '#/components/schemas/GateChannel'
      required:
      - channel
      - listing_count
      - name
      - name_fa
      - slug
    ClosedReasonEnum:
      enum:
      - owner
      - users
      - expired
      type: string
      description: |-
        * `owner` - owner
        * `users` - users
        * `expired` - expired
    Contact:
      type: object
      properties:
        telegram:
          type: string
          description: 'Handle without @. Blank: none.'
        telegram_url:
          type: string
        phone:
          type: string
        source_url:
          type: string
          description: 'The original post. Blank: none, so no «دیدن پست اصلی».'
        has_any:
          type: boolean
          description: 'False: nothing to show (F11#17).'
        membership_checked:
          type: boolean
          description: 'False: do not print «عضو کانال» (F11#19).'
        gate:
          allOf:
          - $ref: '#/components/schemas/GateEnum'
          description: |-
            How this contact opened. owner: the person's own listing, nothing was counted.

            * `member` - member
            * `failed_open` - failed_open
            * `gate_off` - gate_off
            * `owner` - owner
        reveals_left:
          type: integer
          description: New listings this person can still open in the rolling 24 hours.
      required:
      - gate
      - has_any
      - membership_checked
      - phone
      - reveals_left
      - source_url
      - telegram
      - telegram_url
    CountryRow:
      type: object
      properties:
        code:
          type: string
        channel:
          allOf:
          - $ref: '#/components/schemas/GateChannel'
          nullable: true
        cities:
          type: array
          items:
            $ref: '#/components/schemas/CityRow'
      required:
      - channel
      - cities
      - code
    DeepLink:
      type: object
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/DeepLinkKindEnum'
          description: |-
            landing: a normal open. legacy: go to legacy_path, a template page.

            * `landing` - landing
            * `country` - country
            * `city` - city
            * `listing` - listing
            * `legacy` - legacy
        malformed:
          type: boolean
          description: The link could not be read, so this is a normal open.
        country:
          type: string
        city:
          type: string
          description: The metro's name. From the listing when the link has one.
        city_slug:
          type: string
        city_known:
          type: boolean
          description: 'False: no channel for this city, so choose one.'
        listing_id:
          type: integer
          nullable: true
          description: 'Can differ from the link: a merged listing resolves to the
            one it became.'
        listing_state:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ListingStateEnum'
          - $ref: '#/components/schemas/NullEnum'
        filters:
          $ref: '#/components/schemas/DeepLinkFilters'
        src:
          type: string
          description: Pass to the exchange as `src`, so the first one is stored once.
        legacy_path:
          type: string
      required:
      - city
      - city_known
      - city_slug
      - country
      - filters
      - kind
      - legacy_path
      - listing_id
      - listing_state
      - malformed
      - src
    DeepLinkFilters:
      type: object
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/PropertyTypeEnum'
        min:
          type: integer
          nullable: true
        max:
          type: integer
          nullable: true
      required:
      - max
      - min
      - types
    DeepLinkKindEnum:
      enum:
      - landing
      - country
      - city
      - listing
      - legacy
      type: string
      description: |-
        * `landing` - landing
        * `country` - country
        * `city` - city
        * `listing` - listing
        * `legacy` - legacy
    Exchange:
      type: object
      properties:
        access_token:
          type: string
          description: 'Send as `Authorization: Bearer` on /me calls only. Never on
            /public calls: that skips the cache.'
        expires_in:
          type: integer
          description: Seconds. Exchange again on every launch.
        user:
          $ref: '#/components/schemas/ExchangeUser'
        prefs:
          $ref: '#/components/schemas/Prefs'
        miniapp_v2:
          type: boolean
          description: 'Always true on a 200: a person without the flag gets `miniapp_off`.'
      required:
      - access_token
      - expires_in
      - miniapp_v2
      - prefs
      - user
    ExchangeRequestRequest:
      type: object
      properties:
        init_data:
          type: string
          description: 'Telegram.WebApp.initData. Blank or missing: auth_outside.'
          maxLength: 8192
        src:
          type: string
          description: The link tag from the deep link. Stored once; a bad one is
            ignored.
          maxLength: 64
    ExchangeUser:
      type: object
      properties:
        id:
          type: integer
        telegram_user_id:
          type: integer
        first_name:
          type: string
        telegram_username:
          type: string
          nullable: true
      required:
      - first_name
      - id
      - telegram_user_id
      - telegram_username
    Feed:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicCard'
        total:
