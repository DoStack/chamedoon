{% extends "admin/base.html" %}
{% load unfold %}

{% block content %}
<style>
  .funnel-wrap { overflow-x: auto; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .funnel-wrap td, .funnel-wrap th { border-bottom: 1px solid rgb(228 228 231 / 0.6); white-space: nowrap; }
  html.dark .funnel-wrap td, html.dark .funnel-wrap th { border-bottom-color: rgb(63 63 70); }
</style>
{% component "unfold/components/container.html" %}
  {% component "unfold/components/title.html" %}Outreach funnel{% endcomponent %}
  <div class="funnel-wrap">{{ content }}</div>
{% endcomponent %}
{% endblock %}
