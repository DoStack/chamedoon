{% load static %}
<!DOCTYPE html>
<html lang="{{ locale }}" dir="{{ dir }}" class="{% block html_class %}{% endblock %}" data-tg-bot="{{ telegram_bot }}" data-tg-app="{{ telegram_app_short_name }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ m.appName }}{% endblock %}</title>
  <meta name="description" content="{{ m.tagline }}">
  <meta name="theme-color" content="#FF7A00">
  <link rel="icon" href="{% static 'miniapp/favicon.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'miniapp/favicon.ico' %}" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'miniapp/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'miniapp/site.webmanifest' %}">
  {% if locale == "fa" %}
    <link rel="preload" href="{% static 'miniapp/fonts/IRANSansWeb_FaNum.woff2' %}" as="font" type="font/woff2" crossorigin>
  {% endif %}
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="{% static 'miniapp/startapp.js' %}?v=20260920n"></script>
  <script src="{% static 'miniapp/theme.js' %}?v=20260920n"></script>
  <link rel="stylesheet" href="{% static 'miniapp/app.css' %}?v=20260920n">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="header-end"></div>
    </header>
    {% block content %}{% endblock %}
  </div>
  <script src="{% static 'miniapp/nav.js' %}?v=20260920n" defer></script>
  <script src="{% static 'miniapp/list-loader.js' %}?v=20260920n" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
