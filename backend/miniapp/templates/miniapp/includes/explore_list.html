{% if not rows %}
  <p class="lede">{{ m.explore.empty }}</p>
{% else %}
  <div class="card-list">
    {% for row in rows %}
      <a class="card listing-card" href="{{ row.href }}">
        {% include "miniapp/includes/listing_card_inner.html" with row=row %}
      </a>
    {% endfor %}
  </div>
{% endif %}
