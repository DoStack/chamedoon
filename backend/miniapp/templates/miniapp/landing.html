{% extends "miniapp/base.html" %}
{% block content %}
  <div class="hero">
    <p class="muted" style="letter-spacing:.2em;text-transform:uppercase;font-size:.75rem;font-weight:600;">{{ m.tagline }}</p>
    <h1 style="font-size:2.25rem;margin-top:.75rem;">{{ m.appName }}</h1>
    <p class="lede">{{ m.home.prompt }}</p>
    <div class="stack">
      {% if telegram_app_url %}
        <a class="btn btn-primary" href="{{ telegram_app_url }}">{{ m.home.send }}</a>
        <a class="btn btn-primary" href="{{ telegram_app_url }}?startapp=supply">{{ m.home.carry }}</a>
        <a class="btn btn-secondary" href="{{ telegram_app_url }}">{{ m.auth.openButton }}</a>
      {% else %}
        <a class="btn btn-primary" href="/app/">{{ m.home.send }}</a>
        <a class="btn btn-secondary" href="/app/">{{ m.auth.openButton }}</a>
      {% endif %}
    </div>
  </div>
{% endblock %}
