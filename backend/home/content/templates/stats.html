<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:VazirLocal;src:url(fonts/vazirmatn-arabic-wght400-800.woff2) format('woff2');font-weight:400 800;unicode-range:U+0600-06FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:VazirLocal;src:url(fonts/vazirmatn-latin-wght400-800.woff2) format('woff2');font-weight:400 800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Vazirmatn,VazirLocal,sans-serif;background:#FAFAF8;color:#18212B;direction:rtl;padding:64px 60px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:30px;color:#B8410C}
.brand svg{width:34px;height:48px}
.chip{background:#EFEDE8;color:#5B6570;font-weight:600;font-size:26px;padding:10px 22px;border-radius:999px;text-align:center;line-height:1.35}
.chip small{display:block;font-size:20px;direction:ltr}
h1{font-size:64px;font-weight:900;margin-top:34px;line-height:1.15}
h1 b{color:#B8410C}
.box{background:#fff;border:2px solid #E6E3DC;border-radius:28px;padding:26px 32px;margin-top:28px}
.h{font-size:28px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between}
.h span{font-size:23px;color:#5B6570;font-weight:600}
.r{display:grid;grid-template-columns:170px 1fr 150px;gap:18px;align-items:center;padding:8px 0}
.t{font-size:30px;font-weight:700}
.bar{height:20px;border-radius:10px;background:#EFEDE8;position:relative}
.bar i{position:absolute;right:0;top:0;bottom:0;border-radius:10px;background:#B8410C}
.bar.s i{background:#E8A27D}
.v{font-size:32px;font-weight:900;text-align:left;direction:ltr}
.facts{display:flex;gap:18px;margin-top:24px}
.f{flex:1;background:#FBEEE7;border-radius:24px;padding:22px 24px}
.f b{display:block;font-size:34px;font-weight:900;color:#8F320A;direction:ltr;text-align:right}
.f span{font-size:23px;color:#5B6570;font-weight:600}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:26px;color:#5B6570;font-weight:500}
.foot b{color:#B8410C;direction:ltr}
</style></head><body>
<div class="top"><div class="brand"><svg viewBox="0 0 120 168" fill="none"><path stroke="currentColor" stroke-width="14" stroke-linecap="round" d="M36 28c0-14 48-14 48 0"/><path fill="currentColor" fill-rule="evenodd" d="M60 34c-28 0-48 22-48 48 0 30 32 64 48 82 16-18 48-52 48-82 0-26-20-48-48-48zm0 30a18 18 0 1 1 0 36 18 18 0 0 1 0-36z"/></svg>چمدون خانه</div><div class="chip" id="chip"></div></div>
<h1 id="h1"></h1>
<div class="box"><div class="h"><em id="ah" style="font-style:normal"></em><span>۲۴ ساعت گذشته</span></div><div id="a"></div></div>
<div class="box"><div class="h">میانه اجاره ماهانه<span>۳۰ روز اخیر</span></div><div id="b"></div></div>
<div class="facts" id="fc"></div>
<div class="foot"><span>آمار روزانه</span><b id="hd"></b></div>
<script>window.DATA=__DATA__</script>
<script>
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const m=v=>fa(v.toLocaleString('en-US')).replace(/,/g,'٬');
const D=window.DATA;
chip.innerHTML=D.chip+'<small>'+D.chip_en+'</small>'; h1.innerHTML='خلاصه امروز <b>'+D.fa+'</b>'; ah.textContent=fa(D.n2)+' آگهی تازه به تفکیک نوع'; hd.textContent='@'+D.username;
const mx=Math.max(...D.rows.map(x=>x[1]));
a.innerHTML=D.rows.map(x=>`<div class="r"><div class="t">${x[0]}</div><div class="bar s"><i style="width:${x[1]/mx*100}%"></i></div><div class="v">${fa(x[1])}</div></div>`).join('');
const mm=Math.max(...D.meds.map(x=>x[1]));
b.innerHTML=D.meds.map(x=>`<div class="r"><div class="t">${x[0]}</div><div class="bar"><i style="width:${x[1]/mm*100}%"></i></div><div class="v">${D.sym}${m(x[1])}</div></div>`).join('');
fc.innerHTML=D.facts.map(x=>`<div class="f"><b style="direction:${x[2]?'ltr':'rtl'}">${x[0]}</b><span>${x[1]}</span></div>`).join('');
</script></body></html>
