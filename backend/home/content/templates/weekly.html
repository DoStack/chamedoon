<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:VazirLocal;src:url(fonts/vazirmatn-arabic-wght400-800.woff2) format('woff2');font-weight:400 800;unicode-range:U+0600-06FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:VazirLocal;src:url(fonts/vazirmatn-latin-wght400-800.woff2) format('woff2');font-weight:400 800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Vazirmatn,VazirLocal,sans-serif;background:#FFF8F3;color:#18212B;direction:rtl;display:flex;flex-direction:column}
.band{background:#B8410C;color:#fff;padding:64px 60px 46px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:30px}
.brand svg{width:34px;height:48px}
.chip{background:rgba(255,255,255,.18);font-weight:600;font-size:24px;padding:10px 22px;border-radius:999px;text-align:center;line-height:1.35}
.chip small{display:block;font-size:20px;opacity:.85;direction:ltr}
h1{font-size:70px;font-weight:900;margin-top:30px;line-height:1.12}
.sub{font-size:32px;color:#FBD9C6;font-weight:600;margin-top:12px}
.sub b{color:#fff;font-weight:900}
.main{padding:34px 60px 56px;flex:1;display:flex;flex-direction:column}
.mh{font-size:27px;color:#5B6570;font-weight:700}
.tbl{margin-top:14px;background:#fff;border:2px solid #E6E3DC;border-radius:28px;padding:10px 32px}
.r{display:grid;grid-template-columns:180px 1fr 190px;align-items:center;gap:20px;padding:26px 0;border-bottom:2px solid #E6E3DC}
.r:last-child{border:0}
.ty{font-size:34px;font-weight:800}
.ty small{display:block;font-size:20px;color:#5B6570;font-weight:600}
.bar{height:22px;border-radius:11px;background:#EFEDE8;position:relative;overflow:hidden}
.bar i{position:absolute;right:0;top:0;bottom:0;border-radius:11px;background:#B8410C}
.v{font-size:40px;font-weight:900;text-align:left;direction:ltr}
.ar{display:flex;gap:18px;margin-top:14px}
.ar div{flex:1;background:#FBEEE7;border-radius:22px;padding:26px 24px}
.ar b{display:block;font-size:29px;font-weight:800;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar span{font-size:24px;color:#8F320A;font-weight:700}
.sec{margin-top:40px}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:26px;color:#5B6570;font-weight:500;padding-top:20px}
.foot b{color:#B8410C;direction:ltr}
</style></head><body>
<script>window.DATA=__DATA__</script>
<div class="band" id="band"><div class="top"><div class="brand"><svg viewBox="0 0 120 168" fill="none"><path stroke="currentColor" stroke-width="14" stroke-linecap="round" d="M36 28c0-14 48-14 48 0"/><path fill="currentColor" fill-rule="evenodd" d="M60 34c-28 0-48 22-48 48 0 30 32 64 48 82 16-18 48-52 48-82 0-26-20-48-48-48zm0 30a18 18 0 1 1 0 36 18 18 0 0 1 0-36z"/></svg>چمدون خانه</div>
<div class="chip" id="chip"></div></div>
<h1 id="h1"></h1><div class="sub" id="sub"></div></div>
<div class="main">
<div id="tb"><div class="mh">میانه اجاره ماهانه آگهی‌های این هفته</div><div class="tbl" id="t"></div></div>
<div class="sec" id="as"><div class="mh">پرآگهی‌ترین منطقه‌ها</div><div class="ar" id="ar"></div></div>
<div class="foot" id="ft"><span>گزارش هفتگی · هر یکشنبه</span><b id="hd"></b></div>
</div>
<script>
const D=window.DATA;
chip.innerHTML=D.chip+'<small>'+D.chip_en+'</small>';
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const m=v=>fa(Math.round(v).toLocaleString('en-US')).replace(/,/g,'٬');
h1.innerHTML='بازار اجاره '+D.fa+'<br>هفته گذشته';
sub.innerHTML=`<b>${fa(D.total)}</b> آگهی تازه · ${fa(D.offer)} اجاره، ${fa(D.wanted)} دنبال خانه`;
hd.textContent='@'+D.username;
const mx=Math.max(...D.meds.map(x=>x[1]));
t.innerHTML=D.meds.map(x=>`<div class="r"><div class="ty">${x[0]}<small>از ${fa(x[2])} آگهی</small></div><div class="bar"><i data-w="${x[1]/mx*100}"></i></div><div class="v" data-v="${x[1]}">${D.sym}${m(x[1])}</div></div>`).join('');
if(D.areas.length) ar.innerHTML=D.areas.map(x=>`<div><b>${x[0]}</b><span>${fa(x[1])} آگهی</span></div>`).join(''); else as.remove();
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const show=(el,p,dy=40)=>{if(!el)return;el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`};
window.setT=t=>{
 const bp=ease(t/0.7); band.style.transform=`translateY(${(bp-1)*100}%)`;
 show(h1,ease((t-0.5)/0.6),30); show(sub,ease((t-0.9)/0.6),20);
 show(document.querySelector('#tb .mh'),ease((t-1.6)/0.5),20);
 [...t_rows()].forEach((r,i)=>{const p=ease((t-1.9-i*0.45)/0.6);show(r,Math.min(1,p*1.5),20);const b=r.querySelector('i');b.style.width=(b.dataset.w*ease((t-2.1-i*0.45)/1.0))+'%';const v=r.querySelector('.v');v.textContent=D.sym+m(v.dataset.v*ease((t-2.1-i*0.45)/1.0))});
 const as_=document.getElementById('as'); if(as_){show(as_.querySelector('.mh'),ease((t-4.0)/0.5),20);[...ar.children].forEach((c,i)=>show(c,ease((t-4.3-i*0.25)/0.5),40));}
 show(ft,ease((t-5.2)/0.6),20);
};
function t_rows(){return document.querySelectorAll('#t .r')}
setT(99);
</script></body></html>
