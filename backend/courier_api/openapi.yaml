          type: string
        username:
          type: string
        title:
          type: string
      required:
      - country
      - title
      - username
    City:
      type: object
      properties:
        slug:
          type: string
        name_fa:
          type: string
        name_en:
          type: string
      required:
      - name_en
      - name_fa
      - slug
    CityCreateRequest:
      type: object
      properties:
        country:
          type: string
          minLength: 2
          maxLength: 2
        name:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - country
      - name
    CloseRequestRequest:
      type: object
