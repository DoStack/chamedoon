                  code:
                    type: string
                    enum:
                    - rate_limited
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '500':
          description: '`server_error`: Something failed on our side. Safe to retry.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - server_error
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
        '503':
          description: '`maintenance`: Maintenance is on. See /meta/.'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - detail
                properties:
                  code:
                    type: string
                    enum:
                    - maintenance
                  detail:
                    type: string
                    description: For logs only. Never shown or switched on.
      x-error-codes:
      - auth_invalid
      - auth_required
      - bad_request
      - city_invalid
      - flag_off
      - maintenance
      - method_not_allowed
      - rate_limited
      - server_error
      - token_expired
      - user_blocked
      - validation_failed
      - version_mismatch
