components:
  schemas:
    Alert:
      type: object
      properties:
        id:
          type: integer
        side:
          $ref: '#/components/schemas/RequestTypeEnum'
        origin:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        date_from:
          type: string
          format: date
          nullable: true
        date_to:
          type: string
          format: date
          nullable: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_sent_at:
          type: string
          format: date-time
          nullable: true
      required:
      - active
      - created_at
      - date_from
      - date_to
      - destination
      - id
      - last_sent_at
      - origin
      - side
      - weight_kg
    AlertCreateRequest:
      type: object
      properties:
        side:
          $ref: '#/components/schemas/RequestTypeEnum'
        origin:
          type: string
          default: ''
          description: COUNTRY:city-slug
        destination:
          type: string
          default: ''
          description: COUNTRY:city-slug
        month:
          oneOf:
          - type: string
            default: ''
            pattern: ^\d{4}-\d{2}$
          - type: string
            maxLength: 0
        size:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/SizeEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - side
    AlertSaved:
      type: object
      properties:
        alert:
          $ref: '#/components/schemas/Alert'
        created:
          type: boolean
        sending_on:
          type: boolean
      required:
      - alert
      - created
      - sending_on
    Alerts:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        cap:
          type: integer
        sending_on:
          type: boolean
      required:
      - alerts
      - cap
      - sending_on
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        code:
          type: string
        name_fa:
          type: string
        name_en:
          type: string
      required:
      - code
      - name_en
      - name_fa
    CategoryOption:
      type: object
      properties:
        code:
          type: string
        name_fa:
          type: string
        name_en:
          type: string
      required:
      - code
      - name_en
      - name_fa
    Channel:
      type: object
      properties:
